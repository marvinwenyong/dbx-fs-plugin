name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 官方 CLI 只支持 Rust/Go 后端源码构建，且没有"使用预编译产物"的开关。
      # dbxfs 的真实后端是 Node SEA 单文件，因此先用 SEA 生成一个 go.exe shim，
      # 把预置产物落到 CLI 期望的输出路径，让官方打包流程原样跑通。
      - name: Build go shim
        run: node build/build-shim.cjs

      - name: Build Node SEA backend
        run: node build/build.cjs

      - name: Install DBX plugin CLI
        run: npm install --global @dbx-app/plugin-cli@0.1.10

      # CLI 通过 PATH 调 go 命令。runner 镜像可能自带真 Go，但 go-shim/ 里没有
      # Go 源码，真 go build 必然失败；因此把 SEA 生成的 go.exe shim 与真实后端
      # 放进同一目录并前置 PATH，让假 go 截获 -o 参数、把预置产物落到目标路径。
      - name: Package candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runner-shim | Out-Null
          Copy-Item build/go.exe runner-shim/go.exe
          Copy-Item bin/windows-x64/dbxfs.exe runner-shim/dbxfs.exe
          $env:PATH = "$(Get-Location)\runner-shim;$env:PATH"
          dbx-plugin package . --target windows-x64 --output-dir dist

      - name: Acceptance test on packaged binary
        run: node tests/acceptance.cjs --exe

      # DBX Store 同步器从 Release 里的 release-candidates.json 读取候选信息，
      # 缺这个文件商店无法自动创建候选 PR。url 用本仓库 + 本次 tag 拼真实下载地址。
      - name: Generate release-candidates.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node build/make-release-candidates.cjs dist

      - name: Publish assets to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dbxp
            dist/*.artifact.json
            dist/release-candidates.json

# 多平台扩展（当前仅发布已验证的 windows-x64；补平台前需在对应 runner 上验证）：
#   1. 把 release job 改为 matrix.strategy.matrix.include:
#        [{ target: windows-x64, runs-on: windows-latest },
#         { target: darwin-x64,  runs-on: macos-13 },
#         { target: darwin-arm64, runs-on: macos-14 },
#         { target: linux-x64,   runs-on: ubuntu-latest }]
#   2. dbx-plugin package . --target ${{ matrix.target }} --output-dir dist
#   3. 用 actions/upload-artifact 汇总各平台产物，再由一个 publish job 下载、
#      生成 release-candidates.json 并上传（URL 仍按本仓库 + tag 拼接）。
